# ============================================================
# Blog 后台管理系统 - Nginx 配置
# ------------------------------------------------------------
# 服务器实际目录：
#   /opt/blog-admin/        后台前端文件（index.html + assets/）
#   /opt/blog-server/       后端服务
#   /opt/geek-blog/         博客前台源码
#
# 用法：
#   1. 放到 /etc/nginx/conf.d/blog-admin.conf
#   2. 改域名和证书路径
#   3. nginx -t 检查语法，nginx -s reload 重新加载
# ============================================================

server {
    listen 80;
    server_name qisui.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name qisui.asia;

    # ===== 证书 =====
    ssl_certificate     /etc/nginx/ssl/xiaoxinl.asia.pem;
    ssl_certificate_key /etc/nginx/ssl/xiaoxinl.asia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ===== 博客前台（域名根目录）=====
    root /var/www/blog;
    index index.html;

    # 博客用的是 history 路由（/blog/1），这句必须有，否则刷新子页面 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 后台管理（子目录 /admin/）=====
    # 关键点一：用 alias 不是 root
    #   alias 会把 /admin/assets/x.js 换成 /opt/blog-admin/assets/x.js
    #   root 会拼成 /opt/blog-admin/admin/assets/x.js，找不到文件
    #
    # 关键点二：这里绝对不能写 try_files
    #   try_files 里的 $uri 还是完整路径 /admin/assets/x.js，
    #   跟 alias 拼起来就成了 /opt/blog-admin//admin/assets/x.js，必然 404。
    #   后台用的是 hash 路由（/#/articles），浏览器只请求真实存在的文件，
    #   不需要 rewrite，所以不写 try_files 才是对的。
    location /admin/ {
        alias /opt/blog-admin/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # ===== 后端接口 =====
    # 必须配在域名根目录（不是 /admin/request/）
    # proxy_pass 结尾的斜杠表示把 /request/ 前缀去掉再转发，
    # 后端的路由是 /article/、/user/login 这种，没有 /request 前缀。
    location /request/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
