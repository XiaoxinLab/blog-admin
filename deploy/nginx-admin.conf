# ============================================================
# Blog 后台管理系统 - Nginx 配置
# ------------------------------------------------------------
# 用法：
#   1. 把这个文件放到 /etc/nginx/conf.d/blog-admin.conf
#   2. 把域名、证书路径换成你自己的
#   3. nginx -t 检查语法，nginx -s reload 重新加载
# ============================================================

server {
    listen 80;
    server_name admin.qisui.asia;

    # 证书申请用的验证目录（certbot 会用到）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.qisui.asia;

    # ===== 证书 =====
    # 换成你自己的证书路径
    ssl_certificate     /etc/nginx/ssl/xiaoxinl.asia.pem;
    ssl_certificate_key /etc/nginx/ssl/xiaoxinl.asia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ===== 前端静态文件 =====
    root /opt/blog-admin/dist;
    index index.html;

    # 后台用的是 hash 路由（地址形如 /#/articles），
    # 浏览器只会请求真实存在的文件，所以这里不用配 rewrite
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态文件可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后用户能拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ===== 后端接口 =====
    # 同源转发，前端不用处理跨域
    location /request/ {
        proxy_pass         http://127.0.0.1:8000/request/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
